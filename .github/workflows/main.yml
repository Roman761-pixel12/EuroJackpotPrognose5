
name: Build EuroJackpot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android APK bauen
        uses: android-actions/build-android-app@v3
        with:
          project-path: .
          gradle-build-type: debug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: EuroJackpot-APK
          path: app/build/outputs/apk/debug/*.apk
          
